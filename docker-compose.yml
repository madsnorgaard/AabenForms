networks:
  web:
    external: true
  internal:
    external: false
  mail:
    external: true
    name: mail_internal

services:
  aabenforms_db:
    image: mariadb:11
    container_name: aabenforms_db
    env_file:
    - .env
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./data/mysql:/var/lib/mysql
    labels:
      - "traefik.enable=false"
    networks:
      - internal

  drupal:
    container_name: aabenforms_drupal
    env_file:
    - .env
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    working_dir: /opt/drupal
    volumes:
      - ./web/modules/custom:/opt/drupal/web/modules/custom
      - ./web/profiles/custom:/opt/drupal/web/profiles/custom
      - ./web/themes/custom:/opt/drupal/web/themes/custom
      - drupal_files:/opt/drupal/web/sites/default/files
      - ./data/private:/opt/drupal/private
      - ./backups:/opt/drupal/backups
      - ./settings.php:/opt/drupal/web/sites/default/settings.php
      - ./services.prod.yml:/opt/drupal/web/sites/default/services.yml
      - ./config:/opt/drupal/config
    environment:
      COMPOSER_MEMORY_LIMIT: "2G"
      TRUSTED_HOST_PATTERNS: ${TRUSTED_HOST_PATTERNS}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      HASH_SALT: ${HASH_SALT}
      REDIS_HOST: ${REDIS_HOST}
      SMTP_HOST: ${SMTP_HOST:-mail.madsnorgaard.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-tls}
      SMTP_USER: ${SMTP_USER:-mads@madsnorgaard.net}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-mads@madsnorgaard.net}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aabenforms_drupal.rule=Host(`api.aabenforms.dk`)"
      - "traefik.http.routers.aabenforms_drupal.tls.certresolver=lets-encrypt"
      - "traefik.http.services.aabenforms_drupal.loadbalancer.server.port=80"
    networks:
      - internal
      - web
      - mail
    depends_on:
      - aabenforms_db
      - aabenforms_redis

  aabenforms_redis:
    image: library/redis:latest
    container_name: aabenforms_redis
    volumes:
      - ./data/redis:/data
    command: ["redis-server"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

  # Keycloak hosts the public mock IdP at https://auth.aabenforms.dk for the
  # interactive Byggetilladelse demo. Browsers hit the public hostname over
  # TLS via Traefik; Drupal performs the server-side token exchange against
  # the internal http://keycloak:8080 address on the shared internal network
  # so the round-trip stays inside the docker bridge. The H2 store is volume-
  # mounted so the imported realm survives container restarts; on first
  # boot --import-realm seeds the realm from the JSON below. To force a re-
  # --import-realm only imports into an empty database. To re-import after
  # editing the realm JSON: docker compose down keycloak keycloak_db &&
  # docker volume rm api.aabenforms.dk_keycloak_db_data && docker compose up -d.
  # Keycloak database. Keycloak used to run start-dev on an H2 file inside the
  # keycloak_data volume; that store is not upgradable across Keycloak majors
  # (the 23 -> 26 bump on 2026-09-17 crash-looped on it). A real database makes
  # future Keycloak upgrades ordinary schema migrations.
  keycloak_db:
    image: postgres:16-alpine
    container_name: aabenforms_keycloak_db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: aabenforms_keycloak
    restart: always
    depends_on:
      keycloak_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Database (production mode requires one).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      # Bootstrap admin (only used on first start into an empty database).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Hostname v2: public URL fixed; back-channel (Drupal -> http://keycloak:8080)
      # keeps dynamic endpoints. Note the token issuer is always the public URL.
      KC_HOSTNAME: https://auth.aabenforms.dk
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # TLS terminates at Traefik.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./docker/keycloak/realms/danish-gov-test.json:/opt/keycloak/data/import/danish-gov-test.json:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    command:
      - start
      - --import-realm
      - --http-relative-path=/
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aabenforms_keycloak.rule=Host(`auth.aabenforms.dk`)"
      - "traefik.http.routers.aabenforms_keycloak.entrypoints=websecure"
      - "traefik.http.routers.aabenforms_keycloak.tls.certresolver=lets-encrypt"
      - "traefik.http.services.aabenforms_keycloak.loadbalancer.server.port=8080"
    networks:
      - internal
      - web

volumes:
  drupal_files:
  # Old H2 store from Keycloak 23 (start-dev). Kept for rollback; safe to remove later.
  keycloak_data:
  keycloak_db_data:
