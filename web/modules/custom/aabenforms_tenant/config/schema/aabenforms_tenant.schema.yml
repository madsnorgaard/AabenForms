aabenforms_tenant.settings:
  type: config_object
  label: 'AabenForms Tenant settings'
  mapping:
    employee_provisioning:
      type: mapping
      label: 'Employee role provisioning'
      mapping:
        employee_claim_field:
          type: string
          label: 'OIDC claim field used to detect employees'
        employee_claim_match:
          type: string
          label: 'Match rule (equals or starts_with)'
        employee_claim_value:
          type: string
          label: 'Expected claim value'
    tenant_binding:
      type: mapping
      label: 'Auto-bind users to tenants at login'
      mapping:
        claim_field:
          type: string
          label: 'Claim field carrying the tenant discriminator (e.g. cvr)'
        map:
          type: sequence
          label: 'Claim value to tenant id map'
          sequence:
            type: mapping
            mapping:
              claim_value:
                type: string
                label: 'Claim value'
              tenant_id:
                type: string
                label: 'Tenant (domain) id'
