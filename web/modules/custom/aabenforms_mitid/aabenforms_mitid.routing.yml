aabenforms_mitid.settings:
  path: '/admin/config/aabenforms/mitid'
  defaults:
    _form: '\Drupal\aabenforms_mitid\Form\MitidSettingsForm'
    _title: 'MitID OIDC settings'
  requirements:
    _permission: 'administer site configuration'

aabenforms_mitid.demo_session:
  path: '/admin/config/aabenforms/mitid/demo-session'
  defaults:
    _form: '\Drupal\aabenforms_mitid\Form\DemoSessionForm'
    _title: 'Test as demo citizen'
  requirements:
    _permission: 'administer eca'

aabenforms_mitid.login:
  path: '/mitid/login'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::login'
    _title: 'Login with MitID'
  requirements:
    _access: 'TRUE'

aabenforms_mitid.callback:
  path: '/mitid/callback'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::callback'
    _title: 'MitID Callback'
  requirements:
    _access: 'TRUE'

aabenforms_mitid.logout:
  path: '/mitid/logout'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::logout'
    _title: 'Logout'
  requirements:
    _access: 'TRUE'
  methods: [GET, POST]
  options:
    no_cache: TRUE

# The session id never travels in a URL (#156): the SPA redeems a one-time
# login code, then reads its session with "Authorization: Bearer".
aabenforms_mitid.session_exchange:
  path: '/api/mitid/session/exchange'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::exchange'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE

aabenforms_mitid.session_current:
  path: '/api/mitid/session'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::currentSession'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

aabenforms_mitid.session_revoke:
  path: '/api/mitid/session/revoke'
  defaults:
    _controller: '\Drupal\aabenforms_mitid\Controller\MitIdController::revoke'
    _title: 'Revoke MitID session'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE
