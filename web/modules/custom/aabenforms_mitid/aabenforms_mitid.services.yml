services:
  aabenforms_mitid.cpr_extractor:
    class: Drupal\aabenforms_mitid\Service\MitIdCprExtractor
    arguments:
      - '@aabenforms_core.audit_logger'
      - '@logger.factory'

  aabenforms_mitid.session_manager:
    class: Drupal\aabenforms_mitid\Service\MitIdSessionManager
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'
      - '@logger.factory'
      - '@aabenforms_core.audit_logger'

  # The provider-neutral aabenforms_identity.session_manager alias now lives in
  # aabenforms_core, so aabenforms_nemlogin depends on core alone - not on this
  # demo/OIDC module. MitIdSessionManager writes to the SAME keyvalue collection
  # as the core store, so MitID and SAML sessions are mutually readable.

  aabenforms_mitid.token_verifier:
    class: Drupal\aabenforms_mitid\Service\MitIdTokenVerifier
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@cache.default'
      - '@logger.factory'

  aabenforms_mitid.oidc_client:
    class: Drupal\aabenforms_mitid\Service\MitIdOidcClient
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@logger.factory'
      - '@aabenforms_mitid.cpr_extractor'
      - '@aabenforms_mitid.session_manager'
      - '@aabenforms_mitid.token_verifier'
