aabenforms_case.settings:
  type: config_object
  label: 'ÅbenForms Case settings'
  mapping:
    frister:
      type: sequence
      label: 'Per-area deadlines'
      sequence:
        type: mapping
        label: 'Deadline definition'
        mapping:
          unit:
            type: string
            label: 'Unit (hours, hverdage, straks)'
          amount:
            type: integer
            label: 'Amount'
    physical_post_delivery_days:
      type: integer
      label: 'Assumed delivery time for a physical decision letter (calendar days); the klagefrist starts from send date plus this. Must be confirmed by the kommune''s jurist.'
      constraints:
        Range:
          min: 0
          max: 30
