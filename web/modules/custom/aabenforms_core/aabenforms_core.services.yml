services:
  aabenforms_core.serviceplatformen_client:
    class: Drupal\aabenforms_core\Service\ServiceplatformenClient
    arguments:
      - '@config.factory'
      - '@cache.default'
      - '@logger.factory'
      - '@http_client'

  aabenforms_core.encryption_service:
    class: Drupal\aabenforms_core\Service\EncryptionService
    arguments:
      - '@encrypt.encryption_profile.manager'
      - '@key.repository'
      - '@encryption'
      - '@logger.factory'

  aabenforms_core.cpr_access:
    class: Drupal\aabenforms_core\Service\CprAccess
    arguments:
      - '@aabenforms_core.encryption_service'
      - '@aabenforms_core.tenant_resolver'
      - '@logger.factory'

  aabenforms_core.audit_logger:
    class: Drupal\aabenforms_core\Service\AuditLogger
    arguments:
      - '@database'
      - '@current_user'
      - '@request_stack'
      - '@datetime.time'
      - '@logger.factory'
      - '@aabenforms_core.tenant_resolver'

  # Provider-neutral verified-identity session store. Lives in core so both the
  # MitID OIDC rail and the NemLog-in OIOSAML 3 rail depend only on core, not on
  # each other. Both rails share this store's keyvalue collection.
  aabenforms_core.identity_session_manager:
    class: Drupal\aabenforms_core\Service\IdentitySessionManager
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'
      - '@logger.factory'
      - '@aabenforms_core.audit_logger'
  aabenforms_identity.session_manager:
    alias: aabenforms_core.identity_session_manager
  Drupal\aabenforms_core\Identity\SessionManagerInterface:
    alias: aabenforms_core.identity_session_manager

  aabenforms_core.workflow_execution_collector:
    class: Drupal\aabenforms_core\Service\WorkflowExecutionCollector

  aabenforms_core.trace_store:
    class: Drupal\aabenforms_core\Service\TraceStore
    arguments:
      - '@database'
      - '@datetime.time'
      - '@aabenforms_core.tenant_resolver'

  aabenforms_core.tenant_resolver:
    class: Drupal\aabenforms_core\Service\TenantResolver
    arguments:
      - '@domain.negotiator'
      - '@config.factory'
      - '@logger.factory'

  plugin.manager.aabenforms_dashboard_section:
    class: Drupal\aabenforms_core\Dashboard\AabenformsDashboardSectionManager
    parent: default_plugin_manager

  aabenforms_core.dashboard_activity:
    class: Drupal\aabenforms_core\Dashboard\RecentActivityBuilder
    arguments:
      - '@database'
      - '@datetime.time'

  aabenforms_core.demo_family_repository:
    class: Drupal\aabenforms_core\Family\DemoFamilyRepository

  aabenforms_core.family_lookup:
    class: Drupal\aabenforms_core\Family\Sf6006FamilyLookup
    arguments:
      - '@aabenforms_core.serviceplatformen_client'
      - '@config.factory'
      - '@aabenforms_core.demo_family_repository'
      - '@logger.factory'

  Drupal\aabenforms_core\Family\FamilyRelationsLookupInterface:
    alias: aabenforms_core.family_lookup
