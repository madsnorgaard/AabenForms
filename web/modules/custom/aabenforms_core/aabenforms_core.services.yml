services:
  aabenforms_core.serviceplatformen_client:
    class: Drupal\aabenforms_core\Service\ServiceplatformenClient
    arguments:
      - '@config.factory'
      - '@cache.default'
      - '@logger.factory'
      - '@http_client'

  aabenforms_core.encryption_service:
    class: Drupal\aabenforms_core\Service\EncryptionService
    arguments:
      - '@encrypt.encryption_profile.manager'
      - '@key.repository'
      - '@encryption'
      - '@logger.factory'

  aabenforms_core.cpr_access:
    class: Drupal\aabenforms_core\Service\CprAccess
    arguments:
      - '@aabenforms_core.encryption_service'
      - '@aabenforms_core.tenant_resolver'
      - '@logger.factory'

  aabenforms_core.audit_logger:
    class: Drupal\aabenforms_core\Service\AuditLogger
    arguments:
      - '@database'
      - '@current_user'
      - '@request_stack'
      - '@datetime.time'
      - '@logger.factory'
      - '@aabenforms_core.tenant_resolver'

  # Provider-neutral verified-identity session store. Lives in core so both the
  # MitID OIDC rail and the NemLog-in OIOSAML 3 rail depend only on core, not on
  # each other. Both rails share this store's keyvalue collection.
  aabenforms_core.identity_session_manager:
    class: Drupal\aabenforms_core\Service\IdentitySessionManager
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'
      - '@logger.factory'
      - '@aabenforms_core.audit_logger'
  aabenforms_identity.session_manager:
    alias: aabenforms_core.identity_session_manager
  Drupal\aabenforms_core\Identity\SessionManagerInterface:
    alias: aabenforms_core.identity_session_manager

  aabenforms_core.workflow_execution_collector:
    class: Drupal\aabenforms_core\Service\WorkflowExecutionCollector
    arguments:
      - '@aabenforms_core.pii_redactor'

  aabenforms_core.trace_store:
    class: Drupal\aabenforms_core\Service\TraceStore
    arguments:
      - '@database'
      - '@datetime.time'
      - '@aabenforms_core.tenant_resolver'
      - '@aabenforms_core.pii_redactor'

  aabenforms_core.tenant_resolver:
    class: Drupal\aabenforms_core\Service\TenantResolver
    arguments:
      - '@domain.negotiator'
      - '@config.factory'
      - '@logger.factory'

  plugin.manager.aabenforms_dashboard_section:
    class: Drupal\aabenforms_core\Dashboard\AabenformsDashboardSectionManager
    parent: default_plugin_manager

  aabenforms_core.dashboard_activity:
    class: Drupal\aabenforms_core\Dashboard\RecentActivityBuilder
    arguments:
      - '@database'
      - '@datetime.time'

  aabenforms_core.demo_family_repository:
    class: Drupal\aabenforms_core\Family\DemoFamilyRepository

  aabenforms_core.family_lookup:
    class: Drupal\aabenforms_core\Family\Sf6006FamilyLookup
    arguments:
      - '@aabenforms_core.serviceplatformen_client'
      - '@config.factory'
      - '@aabenforms_core.demo_family_repository'
      - '@logger.factory'

  Drupal\aabenforms_core\Family\FamilyRelationsLookupInterface:
    alias: aabenforms_core.family_lookup

  # STIL elevdata is not integrated; the demo rail always reports demo mode.
  aabenforms_core.pupil_enrolment:
    class: Drupal\aabenforms_core\Enrolment\DemoPupilEnrolment
    arguments:
      - '@?aabenforms_institution.registry'

  Drupal\aabenforms_core\Enrolment\PupilEnrolmentLookupInterface:
    alias: aabenforms_core.pupil_enrolment

  # eIndkomst (employment) and NemRefusion (employer sickness report) are not
  # integrated; the demo rail always reports demo mode.
  aabenforms_core.employment_lookup:
    class: Drupal\aabenforms_core\Employment\DemoEmploymentLookup
    arguments:
      - '@datetime.time'

  Drupal\aabenforms_core\Employment\EmploymentLookupInterface:
    alias: aabenforms_core.employment_lookup

  # Absolute URLs into the citizen frontend, from the allowlisted
  # CORS_ALLOW_ORIGIN only (never request input).
  aabenforms_core.frontend_url:
    class: Drupal\aabenforms_core\Service\FrontendUrl

  # Binds a webform submission to the verified MitID identity and the
  # register at intake (applicant CPR, child, other parent, custody).
  aabenforms_core.submission_identity_binder:
    class: Drupal\aabenforms_core\Identity\SubmissionIdentityBinder
    arguments:
      - '@aabenforms_core.cpr_access'
      - '@aabenforms_core.family_lookup'
      - '@aabenforms_core.audit_logger'
      - '@logger.factory'

  # One-time code handoff from an IdP callback to the cross-origin SPA
  # (PKCE-style), so the session id never travels in a URL (#156).
  aabenforms_core.login_handoff:
    class: Drupal\aabenforms_core\Identity\LoginHandoff
    arguments:
      - '@keyvalue.expirable'

  # Masks CPR numbers and capability secrets before anything is persisted
  # (trace table, execution steps, ECA replay store). Issue #74.
  aabenforms_core.pii_redactor:
    class: Drupal\aabenforms_core\Privacy\PiiRedactor

  # Redacting tempstore factories, wired into eca.token_browser only by
  # AabenformsCoreServiceProvider.
  aabenforms_core.redacting_tempstore.private:
    class: Drupal\aabenforms_core\Privacy\RedactingPrivateTempStoreFactory
    arguments: ['@keyvalue.expirable', '@lock', '@current_user', '@request_stack', '@aabenforms_core.pii_redactor', '%tempstore.expire%']
  aabenforms_core.redacting_tempstore.shared:
    class: Drupal\aabenforms_core\Privacy\RedactingSharedTempStoreFactory
    arguments: ['@keyvalue.expirable', '@lock', '@request_stack', '@current_user', '@aabenforms_core.pii_redactor', '%tempstore.expire%']

  # Generic per-route, per-IP rate limiting from aabenforms_core.rate_limits.
  aabenforms_core.route_rate_limit_subscriber:
    class: Drupal\aabenforms_core\EventSubscriber\RouteRateLimitSubscriber
    arguments: ['@config.factory', '@flood']
    tags:
      - { name: event_subscriber }

  # Where demo commands may run: DDEV, or AABENFORMS_DEMO_SITE=1.
  aabenforms_core.demo_environment:
    class: Drupal\aabenforms_core\Demo\DemoEnvironment
