# Configuration schema for ÅbenForms Core module.

aabenforms_core.settings:
  type: config_object
  label: 'ÅbenForms Core settings'
  mapping:
    serviceplatformen:
      type: mapping
      label: 'Serviceplatformen configuration'
      mapping:
        username:
          type: string
          label: 'Serviceplatformen username'
        password:
          type: string
          label: 'Serviceplatformen password'
        urls:
          type: mapping
          label: 'Service endpoint URLs'
          mapping:
            SF1520:
              type: string
              label: 'CPR Lookup service URL (SF1520)'
            SF1530:
              type: string
              label: 'CVR Lookup service URL (SF1530)'
            SF1601:
              type: string
              label: 'Digital Post service URL (SF1601)'
            SF6006:
              type: string
              label: 'Familie+ CPR lookup service URL (SF6006)'
        certificates:
          type: mapping
          label: 'Client certificates'
          mapping:
            cert_path:
              type: string
              label: 'Certificate file path'
            key_path:
              type: string
              label: 'Private key file path'
            password:
              type: string
              label: 'Private key password'
        cache:
          type: mapping
          label: 'Cache settings'
          mapping:
            enabled:
              type: boolean
              label: 'Enable response caching'
            default_expiration:
              type: integer
              label: 'Default cache expiration (seconds)'
    encryption:
      type: mapping
      label: 'Encryption configuration'
      mapping:
        default_profile:
          type: string
          label: 'Default encryption profile ID'
    audit:
      type: mapping
      label: 'Audit logging configuration'
      mapping:
        enabled:
          type: boolean
          label: 'Enable audit logging'
        retention_days:
          type: integer
          label: 'Audit log retention period (days)'

# Tenant-specific configuration
aabenforms_core.tenant.*:
  type: config_object
  label: 'Tenant-specific ÅbenForms Core settings'
  mapping:
    mitid:
      type: mapping
      label: 'MitID configuration'
      mapping:
        client_id:
          type: string
          label: 'MitID client ID'
        client_secret:
          type: string
          label: 'MitID client secret'
    serviceplatformen:
      type: mapping
      label: 'Serviceplatformen tenant configuration'
      mapping:
        certificates:
          type: mapping
          label: 'Tenant-specific certificates'
          mapping:
            cert_path:
              type: string
              label: 'Certificate file path'
            key_path:
              type: string
              label: 'Private key file path'

aabenforms_core.rate_limits:
  type: config_object
  label: 'ÅbenForms per-route rate limits'
  mapping:
    enabled:
      type: boolean
      label: 'Enforce per-route rate limits'
    routes:
      type: sequence
      label: 'Rate-limited routes'
      sequence:
        type: mapping
        label: 'Route limit'
        mapping:
          route:
            type: string
            label: 'Route name, or a prefix ending in *'
          limit:
            type: integer
            label: 'Requests allowed per window and client IP'
          window:
            type: integer
            label: 'Window in seconds'

aabenforms_core.retention:
  type: config_object
  label: 'ÅbenForms retention policy'
  mapping:
    enabled:
      type: boolean
      label: 'Purge due intake copies on cron'
    require_esdh_ref:
      type: boolean
      label: 'Only an ESDH reference counts as journalised (not the SF1470 index alone)'
    default_days_after_close:
      type: integer
      label: 'Days after case closure before purge (below 1 disables)'
    webforms:
      type: sequence
      label: 'Per-webform overrides'
      sequence:
        type: mapping
        label: 'Webform override'
        mapping:
          id:
            type: string
            label: 'Webform machine name'
          days_after_close:
            type: integer
            label: 'Days after case closure before purge (below 1 disables)'
          unlinked_submission_days:
            type: integer
            label: 'Days before an unlinked submission is purged (empty uses the global value)'
            nullable: true
    unlinked_submission_days:
      type: integer
      label: 'Days before a submission that never became a case is purged (below 1 disables)'
    digital_post_log_days:
      type: integer
      label: 'Days before a Digital Post log row is redacted (below 1 disables)'
    batch_size:
      type: integer
      label: 'Maximum purge units per cron run'
