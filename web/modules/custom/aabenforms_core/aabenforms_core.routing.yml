aabenforms_core.dashboard:
  path: '/admin/aabenforms'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\DashboardController::overview'
    _title: 'AabenForms'
  requirements:
    _permission: 'access aabenforms admin'

aabenforms_core.trace_list:
  path: '/admin/aabenforms/trace'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\EvidenceController::list'
    _title: 'Evidence traces'
  requirements:
    _permission: 'access aabenforms admin'

aabenforms_core.trace:
  path: '/admin/aabenforms/trace/{sid}'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\EvidenceController::trace'
    _title: 'Sagsspor'
  requirements:
    _permission: 'access aabenforms admin'
    sid: \d+
  options:
    parameters:
      sid:
        type: integer

aabenforms_core.readiness:
  path: '/admin/aabenforms/readiness'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\ReadinessController::board'
    _title: 'Readiness board'
  requirements:
    _permission: 'access aabenforms admin'

aabenforms_core.landing:
  path: '/aabenforms'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\LandingController::page'
    _title: 'AabenForms'
  requirements:
    _access: 'TRUE'

aabenforms_core.webform_api:
  path: '/api/webform/{id}'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\WebformApiController::getWebform'
    _title: 'Get Webform'
  requirements:
    _permission: 'access webform api'
  options:
    parameters:
      id:
        type: string

aabenforms_core.webform_submit:
  path: '/api/webform/{id}/submit'
  defaults:
    _controller: '\Drupal\aabenforms_core\Controller\WebformApiController::submitWebform'
    _title: 'Submit Webform'
  requirements:
    _permission: 'access webform api'
  methods: [POST]
  options:
    parameters:
      id:
        type: string
