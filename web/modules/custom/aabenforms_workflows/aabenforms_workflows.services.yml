services:
  aabenforms_workflows.bpmn_template_manager:
    class: Drupal\aabenforms_workflows\Service\BpmnTemplateManager
    arguments:
      - '@extension.list.module'
      - '@file_system'
      - '@logger.factory'

  aabenforms_workflows.template_metadata:
    class: Drupal\aabenforms_workflows\Service\WorkflowTemplateMetadata
    arguments:
      - '@aabenforms_workflows.bpmn_template_manager'
      - '@logger.factory'

  aabenforms_workflows.template_instantiator:
    class: Drupal\aabenforms_workflows\Service\WorkflowTemplateInstantiator
    arguments:
      - '@aabenforms_workflows.bpmn_template_manager'
      - '@aabenforms_workflows.template_metadata'
      - '@config.factory'
      - '@entity_type.manager'
      - '@router.builder'
      - '@logger.factory'

  aabenforms_workflows.approval_token:
    class: Drupal\aabenforms_workflows\Service\ApprovalTokenService
    arguments:
      - '@private_key'
      - '@logger.factory'

  # Parent-approval security gate: verifies the MitID-asserted CPR equals
  # the parent_<N>_cpr captured on the original submission. Without this
  # check, any holder of the approval-token URL can authenticate with any
  # MitID account and approve another family's submission. See issue #54.
  aabenforms_workflows.parent_cpr_verifier:
    class: Drupal\aabenforms_workflows\Service\ParentCprVerifier
    arguments:
      - '@aabenforms_mitid.session_manager'
      - '@aabenforms_core.audit_logger'
      - '@logger.factory'
      - '@aabenforms_core.cpr_access'
      - '@aabenforms_core.family_lookup'
      - '@config.factory'

  aabenforms_workflows.appeal_ownership_verifier:
    class: Drupal\aabenforms_workflows\Service\AppealOwnershipVerifier
    arguments:
      - '@aabenforms_mitid.session_manager'
      - '@aabenforms_core.audit_logger'
      - '@logger.factory'
      - '@aabenforms_core.cpr_access'
      - '@entity_type.manager'

  aabenforms_workflows.payment_service:
    class: Drupal\aabenforms_workflows\Service\PaymentService
    arguments:
      - '@logger.factory'

  aabenforms_workflows.sms_service:
    class: Drupal\aabenforms_workflows\Service\SmsService
    arguments:
      - '@logger.factory'

  aabenforms_workflows.pdf_service:
    class: Drupal\aabenforms_workflows\Service\PdfService
    arguments:
      - '@file_system'
      - '@logger.factory'

  aabenforms_workflows.calendar_service:
    class: Drupal\aabenforms_workflows\Service\CalendarService
    arguments:
      - '@logger.factory'

  aabenforms_workflows.gis_service:
    class: Drupal\aabenforms_workflows\Service\GisService
    arguments:
      - '@logger.factory'

  # Directory-backed org-chart lookup, sourced from the
  # aabenforms_workflows.org_chart config. A real LDAP/AD/HR-system
  # integration replaces this via service decoration without touching
  # the action plugin.
  aabenforms_workflows.org_chart:
    class: Drupal\aabenforms_workflows\Service\ConfigOrgChartService
    arguments: ['@config.factory']

  # MED voting service: window open/close, ballot recording (with
  # CPR-hash uniqueness), tabulation. Used by the cron-driven ECA flow
  # and the dashboard ElectionsSection card.
  aabenforms_workflows.election:
    class: Drupal\aabenforms_workflows\Service\ElectionService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.aabenforms_workflows'

  # Payroll forwarding. fake_db default writes to {aabenforms_payroll_log};
  # a real KMD Lon / Silkeborg Data / similar client decorates this when
  # those API contracts are added.
  aabenforms_workflows.payroll:
    class: Drupal\aabenforms_workflows\Service\PayrollService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.aabenforms_workflows'

  logger.channel.aabenforms_workflows:
    parent: logger.channel_base
    arguments: ['aabenforms_workflows']

  # Listens to ConfigEvents::STORAGE_TRANSFORM_IMPORT to copy
  # wizard-created configs into the cim source so drush cim doesn't
  # delete them. See PreserveWizardConfigsSubscriber for the rationale.
  aabenforms_workflows.preserve_wizard_configs:
    class: Drupal\aabenforms_workflows\EventSubscriber\PreserveWizardConfigsSubscriber
    arguments:
      - '@config.storage'
    tags:
      - { name: event_subscriber }
  aabenforms_workflows.eca_graph_builder:
    class: Drupal\aabenforms_workflows\Service\EcaGraphBuilder
    arguments:
      - '@entity_type.manager'
  aabenforms_workflows.flow_graph_renderer:
    class: Drupal\aabenforms_workflows\Service\FlowGraphRenderer
    arguments:
      - '@aabenforms_workflows.eca_graph_builder'
