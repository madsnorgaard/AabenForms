id: sygedagpenge
title: 'Sygedagpenge - oplysningsskema'
description: 'Oplysningsskema til kommunen, når arbejdsgiveren har meldt borgeren syg (NemRefusion). Beskæftigelse og løn hentes fra eIndkomst, så borgeren kun beskriver, hvad hun eller han ikke kan, og hvor længe det forventes at vare. MitID-gated. Demo: integrationer til eIndkomst og NemRefusion er ikke etableret.'
categories: {  }
elements: |
  workflow_id:
    '#type': hidden
  applicant_cpr:
    '#type': cpr_field
    '#title': 'Dit CPR-nummer'
    '#required': true
    '#description': 'Udfyldes automatisk fra MitID. Krypteres ved modtagelse.'
  employer_cvr:
    '#type': textfield
    '#title': 'Arbejdsgiverens CVR-nummer'
    '#required': true
    '#maxlength': 8
    '#pattern': '^[0-9]{8}$'
    '#description': 'Hentes fra din arbejdsgivers sygemelding og fra eIndkomst. Du skal ikke selv finde det.'
  first_sick_day:
    '#type': date
    '#title': 'Første sygedag'
    '#required': true
    '#description': 'Hentes fra din arbejdsgivers sygemelding (NemRefusion). Er du uenig i arbejdsgiverens oplysninger, så giv kommunen besked.'
  sickness_description:
    '#type': textarea
    '#title': 'Hvad kan du ikke på grund af din sygdom?'
    '#required': true
    '#rows': 4
    '#description': 'Beskriv, hvad du ikke kan i dit arbejde lige nu. Du skal ikke oplyse en diagnose.'
  expected_duration:
    '#type': select
    '#title': 'Hvor længe forventer du at være syg?'
    '#required': true
    '#options':
      under_4: 'Under 4 uger'
      '4_8': '4-8 uger'
      over_8: 'Over 8 uger'
      unknown: 'Ved ikke'
  in_treatment:
    '#type': radios
    '#title': 'Er du i behandling?'
    '#required': true
    '#options':
      ja: 'Ja'
      nej: 'Nej'
  contact_phone:
    '#type': tel
    '#title': 'Telefonnummer (valgfrit)'
    '#description': 'Kommunen kan ringe til dig om den første opfølgningssamtale.'
