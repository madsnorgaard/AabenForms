uuid: e5f6a7b8-c9d0-4567-89ab-marriage000001
langcode: en
status: true
dependencies:
  config:
    - webform.webform.marriage_booking
  module:
    - aabenforms_digital_post_eca
    - aabenforms_workflows
    - eca_content
    - modeler_api
third_party_settings:
  modeler_api:
    modeler_id: workflow_modeler
    label: marriage_booking_flow
id: marriage_booking_flow
weight: 0
template: null
events:
  on_submission:
    plugin: 'content_entity:insert'
    configuration:
      type: 'webform_submission marriage_booking'
    successors:
      -
        id: mitid_validate
        condition: ''
conditions:
  gate_marriage_mitid_ok:
    plugin: eca_scalar
    configuration:
      negate: false
      left: '[marriage_mitid_valid_status]'
      right: verified
      operator: equal
      type: value
      case: false
  gate_marriage_mitid_deny:
    plugin: eca_scalar
    configuration:
      negate: true
      left: '[marriage_mitid_valid_status]'
      right: verified
      operator: equal
      type: value
      case: false
gateways: {  }
actions:
  mitid_validate:
    label: 'Validate booking submitter MitID'
    plugin: aabenforms_mitid_validate
    configuration:
      workflow_id_token: workflow_id_marriage
      result_token: marriage_mitid_valid
      session_data_token: marriage_session
    successors:
      -
        id: cpr_lookup_partner1
        condition: gate_marriage_mitid_ok
      -
        id: deny_marriage
        condition: gate_marriage_mitid_deny
  cpr_lookup_partner1:
    label: 'CPR registry lookup (partner 1)'
    plugin: aabenforms_cpr_lookup
    configuration:
      cpr_token: '[webform_submission:values:partner1_cpr:raw]'
      result_token: partner1_data
      use_cache: true
    successors:
      -
        id: cpr_lookup_partner2
        condition: ''
  cpr_lookup_partner2:
    label: 'CPR registry lookup (partner 2)'
    plugin: aabenforms_cpr_lookup
    configuration:
      cpr_token: '[webform_submission:values:partner2_cpr:raw]'
      result_token: partner2_data
      use_cache: true
    successors:
      -
        id: log_received
        condition: ''
  log_received:
    label: 'Log: marriage_booking_submitted'
    plugin: aabenforms_audit_log
    configuration:
      event_type: marriage_booking_submitted
      additional_data_token: ''
      message_template: 'Marriage booking received; both partners CPR-verified.'
      status_token: partner2_data_status
    successors:
      -
        id: send_confirmation
        condition: ''
  send_confirmation:
    label: 'Send confirmation via Digital Post'
    plugin: aabenforms_digital_post_send
    configuration:
      recipient_token: '[webform_submission:values:partner1_cpr:raw]'
      recipient_type: cpr
      sender_cvr_token: ''
      subject_template: 'Bekræftelse af vielsesbooking'
      body_template: '<p>Vi har modtaget jeres ansøgning om borgerlig vielse. I får besked om datoen i Digital Post.</p>'
      type: 'Digital Post'
      result_token: digital_post_result
    successors: {  }
  deny_marriage:
    label: 'Deny: identity not verified'
    plugin: aabenforms_workflow_deny
    configuration:
      event_type: marriage_booking_denied
      step_label: 'Identitet ikke bekræftet'
      message: 'Vi behandlede ikke din booking, fordi vi ikke kunne bekræfte din identitet med MitID. Log ind med MitID, og prøv igen.'
    successors: {  }
